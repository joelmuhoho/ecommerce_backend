name: Enforce PR Source Rules

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

jobs:
  check-pr-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR source and target branches
        run: |
          TARGET=${{ github.event.pull_request.base.ref }}
          SOURCE=${{ github.event.pull_request.head.ref }}

          echo "Target: $TARGET"
          echo "Source: $SOURCE"

          if [ "$TARGET" = "main" ]; then
            case "$SOURCE" in
              develop | release/* | hotfix/*)
                ;;
              *)
                echo "❌ Invalid PR source '$SOURCE' for target 'main'."
                echo "Allowed sources: 'develop', 'release/*', 'hotfix/*'"
                exit 1
                ;;
            esac
          elif [ "$TARGET" = "develop" ]; then
            case "$SOURCE" in
              feature/* | fix/* | bugfix/* | docs/* | test/* | infra/* | chore/* | dependabot/* | renovate/*)
                ;;
              *)
                echo "❌ Invalid PR source '$SOURCE' for target 'develop'."
                echo "Allowed sources: 'feature/*', 'fix/*', 'bugfix/*', 'docs/*', 'test/*', 'infra/*', 'chore/*', 'dependabot/*', 'renovate/*'"
                exit 1
                ;;
            esac
          fi

          echo "✅ PR source '$SOURCE' is valid for target '$TARGET'."
